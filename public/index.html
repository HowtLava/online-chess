<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Play Chess with Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #2f3542; color: white; }
    #board { width: 400px; margin: 20px 0; }
    .controls { display: flex; gap: 10px; margin-bottom: 10px; }
    input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: none; }
    button { background: #2ed573; color: white; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Play Chess Online</h1>
  <div class="controls">
    <button id="createBtn">Create Room</button>
    <input type="text" id="roomInput" placeholder="Enter Room Code" />
    <button id="joinBtn">Join Room</button>
  </div>
  <p id="status">Create or join a room to start.</p>

  <div id="board"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const game = new Chess();
    let playerColor = 'white';
    let currentRoom = null;

    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: (source, piece) => {
        if (game.game_over()) return false;
        if ((playerColor === 'white' && piece.search(/^b/) !== -1) ||
            (playerColor === 'black' && piece.search(/^w/) !== -1)) {
          return false;
        }
      },
      onDrop: (source, target) => {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        socket.emit('makeMove', { roomId: currentRoom, move });
      }
    });

    $('#createBtn').on('click', () => {
      socket.emit('createGame');
    });
    
    $('#joinBtn').on('click', () => {
      const room = $('#roomInput').val().trim();
      if (room) socket.emit('joinGame', room);
    });

    socket.on('gameCreated', ({ roomId, color }) => {
      currentRoom = roomId;
      playerColor = color;
      $('#status').text(`Room Code: ${roomId}. Waiting for your friend...`);
    });

    socket.on('gameJoined', ({ roomId, color }) => {
      currentRoom = roomId;
      playerColor = color;
      board.orientation(color);
      $('#status').text(`Joined Room: ${roomId}. Game started!`);
    });

    socket.on('playerJoined', () => {
      $('#status').text('Friend joined! Your turn.');
    });

    socket.on('moveMade', (move) => {
      game.move(move);
      board.position(game.fen());
    });

    socket.on('error', (msg) => alert(msg));
  </script>
</body>
</html>
